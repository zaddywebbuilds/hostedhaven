name: Deploy to hostedhavens.co

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REMOTE: /home/u513808149/domains/hostedhavens.co/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # The old SFTP action uploaded ./dist/* and never removed anything, which
      # left two problems: a deleted property kept serving its old page forever,
      # and dotfiles were skipped, so .htaccess on the server was whatever was
      # put there first and never changed again.
      #
      # Root level is upload-only on purpose. The previous WordPress install
      # still lives in this same folder, and deleting there would take it out.
      # Each subdirectory is Astro's own, so those are mirrored exactly.
      #
      # Deletion was first run as a dry run (77791a9). It listed three stale
      # hashed CSS bundles and nothing else, which is why it is on here.
      - name: Upload (root files, then each directory)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
        run: |
          set -euo pipefail
          {
            echo 'set sftp:auto-confirm yes'
            echo 'set net:max-retries 3'
            echo 'set net:timeout 20'
            echo "open -u \"$SFTP_USER\" --env-password sftp://$SFTP_HOST:$SFTP_PORT"
            for f in dist/.* dist/*; do
              [ -f "$f" ] || continue
              echo "put -O \"$REMOTE\" \"$f\""
            done
            for d in dist/*/; do
              echo "mirror -R --delete --no-perms --verbose \"$d\" \"$REMOTE/$(basename "$d")\""
            done
            echo 'bye'
          } > upload.lftp
          echo "Uploading $(grep -c '^put' upload.lftp) root files and $(grep -c '^mirror' upload.lftp) directories"
          lftp -f upload.lftp | tee deploy.log
          # lftp logs "Removing old file" both for a file it is replacing and for
          # one it is deleting outright, so this count is not a deletion count.
          # To see genuine orphans, run the same mirror with --dry-run: that
          # transfers nothing, so anything it reports really is only on the server.
          echo "=============================================="
          echo "Files removed or replaced this run: $(grep -c 'Removing old' deploy.log || true)"

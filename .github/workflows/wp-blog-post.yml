name: Auto-publish WordPress blog post

on:
  schedule:
    - cron: '0 14 * * 1-5'     # Mon-Fri 14:00 UTC (9 am ET / 8 am CT)
  workflow_dispatch:             # run manually from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish blog post to WordPress
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
        run: node scripts/wp-post.mjs

      - name: Commit updated queue back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/wp-queue.json
          git diff --cached --quiet || git commit -m "content: mark wp blog post published [skip ci]"
          git push


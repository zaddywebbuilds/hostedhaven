name: Auto-generate blog post

on:
  schedule:
    - cron: '0 14 * * 1,3,5'   # Mon/Wed/Fri 14:00 UTC (9 am ET / 8 am CT)
  workflow_dispatch:             # run manually anytime from the Actions tab

jobs:
  blog-post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post via DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit generated article to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/articles-auto.json scripts/blog-queue.json
          # Only commit when there are staged changes (queue might be empty)
          git diff --cached --quiet || git commit -m "content: auto-generate blog post [skip ci]"
          git push

      - name: Build Astro site
        run: npm run build
        # No BASE_PATH -- building for hostedhavens.co, not GitHub Pages

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          local_path: ./dist/*
          remote_path: /home/u513808149/domains/hostedhavens.co/public_html
          sftp_only: true
